[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvpr27-forensics"
version = "0.1.3"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "opencv-python-headless==4.12.0.88", "scikit-learn==1.7.2", "torch>=2.5.1,<2.9"]

[project.scripts]
forensics = "forensics.cli:main"

[tool.setuptools.packages.find]
include = ["forensics*"]
